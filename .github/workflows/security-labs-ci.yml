name: Security lab tests

on:
  push:
    branches: [main]
    paths:
      - 'security-labs/**'
      - '.github/workflows/security-labs-ci.yml'
  pull_request:
    paths:
      - 'security-labs/**'
      - '.github/workflows/security-labs-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.12 / syntax and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (immutable action SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Runtime information
        run: python3 --version
      - name: Compile Python sources
        run: python3 -m compileall -q security-labs
      - name: Run security-lab unit tests
        run: python3 -m unittest discover -s security-labs -p 'test_*.py' -v
      - name: Smoke test sample detections
        run: |
          python3 security-labs/authentication-detection/detect.py
          python3 security-labs/identity-access-review/review.py
          python3 security-labs/vulnerability-prioritization/prioritize.py
